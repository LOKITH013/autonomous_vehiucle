# ---------------------------------------------------------------------------
# Astra ADAS — master configuration
# All thresholds here are PROJECT PARAMETERS to be tuned/evaluated (Sec 15),
# not universal physical constants.
# ---------------------------------------------------------------------------

detection:
  weights: "models/detection/best.pt"        # M5: IDD fine-tuned YOLOv8s weights (full dataset, imgsz=960).
                                              # Previous baseline: yolov8n.pt (COCO pretrained)
  imgsz: 640              # Better small signal/sign recall; use 416 for CPU speed or 960 for recall.
  conf_threshold: 0.22    # Lowered from 0.35 → detects occluded / distant Indian road users earlier
  iou_threshold: 0.55     # Raised from 0.45 → handles dense lane-less Indian traffic without dropping adjacent vehicles
  class_conf_thresholds:
    traffic light: 0.03
    traffic sign: 0.05
  track_conf_threshold: 0.01
  # All 15 IDD classes — includes Indian-specific classes (auto-rickshaw, rider, animal)
  # that do not exist in COCO and only work after M3/M4 fine-tuning.
  relevant_classes: ["animal", "autorickshaw", "bicycle", "bus", "car", "caravan",
                     "motorcycle", "person", "rider", "traffic light", "traffic sign",
                     "trailer", "train", "truck", "vehicle fallback"]

tracking:
  tracker_yaml: "bytetrack.yaml"   # Ultralytics ByteTrack defaults
  max_lost_frames: 30

lane:
  processing_width: 640   # Resize for lane detection; overlays are mapped back to source resolution.
  max_missing_frames: 3
  # Canny edge detector thresholds
  canny_low:  50
  canny_high: 150
  # Hough transform parameters
  hough_threshold:    20
  hough_min_line_len: 20
  hough_max_line_gap: 300
  # ROI trapezoid: fraction of frame height / half-width at top
  roi_top_frac:  0.58
  roi_top_width: 0.08
  # Fraction of frame width counted as "centred" (±5%)
  centre_tolerance: 0.05

traffic:
  # Minimum color-dominance confidence required to report a light state (0–1)
  min_light_confidence: 0.10
  # Ignore traffic-light boxes smaller than this area (noisy far detections)
  min_bbox_area_px: 50
  # Require enough bright, saturated pixels and a dominant signal color.
  min_color_pixel_fraction: 0.005
  min_color_dominance: 0.55

motion:
  # Suppress apparent image motion smaller than this (pixels/second).
  direction_deadband_px_s: 5.0

hazard:
  # Fallback corridor width (fraction of frame width) if lane detection fails
  fallback_corridor_width_frac: 0.40

depth:
  use_midas: false        # Optional: MiDaS adds substantial per-frame latency; enable when depth is needed.
  # Scale factor to convert MiDaS relative inverse depth to metric distance.
  # distance_m = scale_factor / midas_depth
  scale_factor: 5000.0

distance_proxy:
  # TEMPORARY monocular distance proxy (Sec 12). NOT a validated metric
  # distance measurement. Pinhole approximation:
  #     distance_m = (real_object_width_m * focal_length_px) / bbox_width_px
  # focal_length_px must be calibrated per-camera; this default is a rough
  # placeholder and MUST be replaced during M9.
  focal_length_px: 700
  known_widths_m:
    person: 0.5
    bicycle: 0.6
    car: 1.8
    motorcycle: 0.8
    bus: 2.5
    truck: 2.5
    autorickshaw: 1.3
    rider: 0.8
    animal: 0.8
    caravan: 2.0
    trailer: 2.5
    "vehicle fallback": 1.8

ttc:
  min_valid_closing_speed_mps: 0.2   # below this, treat as "not closing"

risk:
  ttc_high_risk_s: 2.0
  ttc_medium_risk_s: 4.0
  close_distance_high_m: 5.0
  close_distance_medium_m: 12.0

decision:
  brake_ttc_s: 1.5
  slow_down_ttc_s: 3.0

pipeline:
  input_video: "data/samples/sample_road.mp4"
  output_video: "outputs/videos/manual_test.mp4"
  metrics_csv: "outputs/metrics/manual_test.csv"
  frame_skip: 0     # process every frame; increase to skip for speed
  display_scale: 1.0
